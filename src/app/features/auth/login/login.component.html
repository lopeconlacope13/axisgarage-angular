<!-- Grain -->
<div class="grain-overlay"></div>
<div class="vignette"></div>

<section style="min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(135deg,#0a0a0a 0%,#111111 60%,#0f0e0a 100%);padding:1.5rem;">
  
  <a routerLink="/" style="position:absolute;top:2rem;left:2rem;display:flex;align-items:center;gap:0.75rem;opacity:0.7;transition:opacity 0.3s;" onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='0.7'">
    <div style="width:2rem;height:2rem;border:1px solid var(--axis-gold);border-radius:4px;display:flex;align-items:center;justify-content:center;">
      <span style="color:var(--axis-gold);font-family:'Playfair Display',serif;font-weight:700;font-style:italic;font-size:0.9rem;">A</span>
    </div>
    <span class="eyebrow" style="margin:0;">BACK TO ATELIER</span>
  </a>

  <div class="glass-card animate-fade-in" style="width:100%;max-width:28rem;padding:3rem 2.5rem;position:relative;z-index:10;box-shadow:0 25px 50px -12px rgba(0,0,0,0.8);">
    
    <div style="text-align:center;margin-bottom:2.5rem;">
      <h1 class="section-title" style="font-size:1.8rem;margin-bottom:0.5rem;">Access <span style="font-style:italic;color:var(--axis-gold);">Vault</span></h1>
      <p style="color:var(--axis-gray);font-size:0.9rem;">Please identify yourself to proceed.</p>
    </div>

    <!-- Error message feedback -->
    <div *ngIf="error" role="alert" aria-live="polite" style="background:rgba(220,38,38,0.1);border:1px solid rgba(220,38,38,0.3);color:#fca5a5;padding:0.75rem;border-radius:6px;font-size:0.8rem;margin-bottom:1.5rem;text-align:center;">
      {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <!-- ... (se mantiene igual todo lo de arriba hasta el botón Enter Vault) -->
      <div style="margin-bottom:1.5rem;">
        <label for="email" class="eyebrow" style="display:block;margin-bottom:0.5rem;">{{ 'AUTH.LOGIN_EMAIL' | translate }}</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          class="input-dark" 
          placeholder="your@email.com"
          autocomplete="username"
        >
      </div>

      <div style="margin-bottom:2rem;">
        <div style="margin-bottom:0.5rem;">
          <label for="password" class="eyebrow" style="margin:0;">{{ 'AUTH.LOGIN_PASS' | translate }}</label>
        </div>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required 
          class="input-dark" 
          placeholder="••••••••"
          autocomplete="current-password"
        >
      </div>

      <button 
        type="submit" 
        class="btn-gold block" 
        style="width:100%;font-size:0.8rem;padding:0.875rem;margin-bottom:1.5rem;"
        [style.opacity]="loading ? '0.5' : '1'"
        [style.cursor]="loading ? 'not-allowed' : 'pointer'"
      >
        <span>{{ loading ? ('AUTH.LOGIN_BTN_LOADING' | translate) : ('AUTH.LOGIN_BTN' | translate) }}</span>
      </button>

      <!-- ══ OAUTH DIVIDER ══ -->
      <div class="flex items-center justify-center gap-4 mb-6">
        <div style="height:1px;background:rgba(255,255,255,0.05);flex:1;"></div>
        <span class="eyebrow" style="color:var(--axis-gray);font-size:0.6rem;opacity:0.6;">{{ 'AUTH.CONTINUE_WITH' | translate }}</span>
        <div style="height:1px;background:rgba(255,255,255,0.05);flex:1;"></div>
      </div>

      <!-- ══ OAUTH BUTTONS ══ -->
      <div class="flex flex-col gap-3 mb-6">
        <a href="http://localhost:8080/oauth2/authorization/google" 
           style="display:flex;align-items:center;justify-content:center;gap:0.75rem;width:100%;padding:0.75rem;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);border-radius:4px;color:#fff;text-decoration:none;font-size:0.75rem;transition:background 0.3s;"
           onmouseenter="this.style.background='rgba(255,255,255,0.06)'" onmouseleave="this.style.background='rgba(255,255,255,0.03)'">
          <svg viewBox="0 0 24 24" width="16" height="16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            <path d="M1 1h22v22H1z" fill="none"/>
          </svg>
          <span class="eyebrow" style="margin:0;">{{ 'AUTH.GOOGLE' | translate }}</span>
        </a>

        <a href="http://localhost:8080/oauth2/authorization/facebook" 
           style="display:flex;align-items:center;justify-content:center;gap:0.75rem;width:100%;padding:0.75rem;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);border-radius:4px;color:#fff;text-decoration:none;font-size:0.75rem;transition:background 0.3s;"
           onmouseenter="this.style.background='rgba(255,255,255,0.06)'" onmouseleave="this.style.background='rgba(255,255,255,0.03)'">
          <svg viewBox="0 0 24 24" width="16" height="16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M22.675 0H1.325C.593 0 0 .593 0 1.325v21.351C0 23.407.593 24 1.325 24H12.82v-9.294H9.692v-3.622h3.128V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116c.73 0 1.323-.593 1.323-1.325V1.325C24 .593 23.407 0 22.675 0z" fill="#1877F2"/>
          </svg>
          <span class="eyebrow" style="margin:0;">{{ 'AUTH.FACEBOOK' | translate }}</span>
        </a>
      </div>

      <div style="text-align:center;">
        <span class="eyebrow" style="color:var(--axis-gray);font-size:0.65rem;">{{ 'AUTH.NO_ACCOUNT' | translate }} </span>
        <a routerLink="/register" class="eyebrow" style="color:var(--axis-gold);font-size:0.65rem;text-decoration:none;transition:opacity 0.3s;" onmouseenter="this.style.opacity='0.6'" onmouseleave="this.style.opacity='1'">{{ 'AUTH.REGISTER_LINK' | translate }}</a>
      </div>
    </form>

  </div>
</section>
