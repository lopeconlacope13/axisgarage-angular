<!-- Grain y viñeta: mismo fondo atmosférico que el login -->
<div class="grain-overlay"></div>
<div class="vignette"></div>

<section style="min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(135deg,#0a0a0a 0%,#111111 60%,#0f0e0a 100%);padding:1.5rem;">

  <!-- Botón volver al Atelier (arriba izquierda) -->
  <a routerLink="/" style="position:absolute;top:2rem;left:2rem;display:flex;align-items:center;gap:0.75rem;opacity:0.7;transition:opacity 0.3s;" onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='0.7'">
    <div style="width:2rem;height:2rem;border:1px solid var(--axis-gold);border-radius:4px;display:flex;align-items:center;justify-content:center;">
      <span style="color:var(--axis-gold);font-family:'Playfair Display',serif;font-weight:700;font-style:italic;font-size:0.9rem;">A</span>
    </div>
    <span class="eyebrow" style="margin:0;">AXIS GARAGE</span>
  </a>

  <!-- Tarjeta central con glassmorphism -->
  <div class="glass-card animate-fade-in" style="width:100%;max-width:28rem;padding:3rem 2.5rem;position:relative;z-index:10;box-shadow:0 25px 50px -12px rgba(0,0,0,0.8);">

    <!-- Cabecera -->
    <div style="text-align:center;margin-bottom:2.5rem;">
      <h1 class="section-title" style="font-size:1.8rem;margin-bottom:0.5rem;">{{ 'AUTH.FORGOT_TITLE' | translate }}</h1>
      <p style="color:var(--axis-gray);font-size:0.9rem;line-height:1.6;">
        {{ 'AUTH.FORGOT_DESC' | translate }}
      </p>
    </div>

    <!-- Estado: email enviado correctamente -->
    @if (success) {
      <div style="text-align:center;">
        <div style="width:3rem;height:3rem;border:1px solid var(--axis-gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--axis-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <p style="color:var(--axis-gold);font-size:0.9rem;line-height:1.7;margin-bottom:2rem;">
          {{ 'AUTH.FORGOT_SUCCESS_DESC' | translate }}
        </p>
        <a routerLink="/login" class="btn-gold-outline" style="display:block;text-align:center;">
          {{ 'AUTH.FORGOT_BACK_BTN' | translate }}
        </a>
      </div>
    } @else {
      <!-- Formulario de solicitud -->
      <form (ngSubmit)="onSubmit()" #forgotForm="ngForm">

        <!-- Error de red/servidor -->
        @if (errorMessage) {
          <div role="alert" aria-live="polite" style="background:rgba(220,38,38,0.1);border:1px solid rgba(220,38,38,0.3);color:#fca5a5;padding:0.75rem;border-radius:6px;font-size:0.8rem;margin-bottom:1.5rem;text-align:center;">
            {{ errorMessage }}
          </div>
        }

        <!-- Campo email -->
        <div style="margin-bottom:1.75rem;">
          <label for="fp-email" class="eyebrow" style="display:block;margin-bottom:0.5rem;">{{ 'AUTH.FORGOT_EMAIL_LABEL' | translate }}</label>
          <input
            type="email"
            id="fp-email"
            name="email"
            [(ngModel)]="email"
            required
            class="input-dark"
            placeholder="your@email.com"
            autocomplete="email"
          >
        </div>

        <!-- Botón enviar -->
        <button
          type="submit"
          class="btn-gold block"
          style="width:100%;font-size:0.8rem;padding:0.875rem;margin-bottom:1.5rem;"
          [style.opacity]="loading ? '0.5' : '1'"
          [style.cursor]="loading ? 'not-allowed' : 'pointer'"
          [disabled]="loading"
        >
          {{ loading ? ('AUTH.FORGOT_SUBMITTING' | translate) : ('AUTH.FORGOT_SUBMIT' | translate) }}
        </button>

        <!-- Link volver al login -->
        <div style="text-align:center;">
          <a routerLink="/login" class="eyebrow" style="color:var(--axis-gold);font-size:0.65rem;text-decoration:none;transition:opacity 0.3s;" onmouseenter="this.style.opacity='0.6'" onmouseleave="this.style.opacity='1'">
            {{ 'AUTH.FORGOT_BACK_LOGIN' | translate }}
          </a>
        </div>

      </form>
    }

  </div>
</section>
