<div class="max-w-7xl mx-auto px-6 pt-32 pb-20">

  <div class="eyebrow mb-2" style="color:var(--axis-gold)">{{ 'BRANDS.EYEBROW' | translate }}</div>
  <h1 class="section-title mb-4">{{ 'BRANDS.TITLE' | translate }} <span class="italic">{{ 'BRANDS.TITLE_ITALIC' | translate }}</span></h1>
  <p style="color:var(--axis-gray);max-width:32rem;margin-bottom:3.5rem;line-height:1.7;font-size:0.95rem;">
    {{ 'BRANDS.SUBTITLE' | translate }}
  </p>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    @for (b of brands; track b.name) {
      <div class="glass-card p-6" style="display:flex;flex-direction:column;gap:0.5rem;">
        <!-- Logo de la marca — si el archivo no existe, se oculta automáticamente -->
        <div style="height:3rem;display:flex;align-items:center;margin-bottom:0.5rem;">
          <img [src]="b.logoUrl" [alt]="b.name"
               style="max-height:2.5rem;max-width:8rem;object-fit:contain;filter:brightness(0) invert(1);opacity:0.75;"
               onerror="this.style.display='none'">
        </div>
        <div class="font-display text-lg font-semibold" style="color:var(--axis-gold);">{{ b.name }}</div>
        <div class="eyebrow" style="font-size:0.6rem;opacity:0.5;">{{ b.origin }}</div>
        <p class="text-axis-gray text-sm" style="line-height:1.6;margin-top:0.25rem;">{{ b.tagline }}</p>
      </div>
    }
  </div>

  <div style="margin-top:3rem;text-align:center;">
    <a routerLink="/vehicles" class="btn-gold" style="font-size:0.75rem;">{{ 'BRANDS.CTA' | translate }}</a>
  </div>
</div>
