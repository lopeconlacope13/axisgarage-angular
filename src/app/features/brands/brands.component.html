<div class="max-w-7xl mx-auto px-6 pt-32 pb-20">

  <div class="eyebrow mb-2" style="color:var(--axis-gold);font-size:0.75rem;">{{ 'BRANDS.EYEBROW' | translate }}</div>
  <h1 class="section-title mb-4">{{ 'BRANDS.TITLE' | translate }} <span class="italic">{{ 'BRANDS.TITLE_ITALIC' | translate }}</span></h1>
  <p class="brands-subtitle">
    {{ 'BRANDS.SUBTITLE' | translate }}
  </p>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    @for (b of brands; track b.name) {
      <div class="glass-card p-6" style="display:flex;flex-direction:column;gap:0.5rem;">
        <!-- Logo de la marca — si el archivo no existe, se oculta automáticamente -->
        <div class="brand-logo-wrap">
          <img [src]="b.logoUrl" [alt]="b.name"
               class="brand-logo-img"
               onerror="this.style.display='none'">
        </div>
        <div class="font-display text-lg font-semibold brand-name">{{ b.name }}</div>
        <div class="eyebrow brand-origin">{{ b.origin }}</div>
        <p class="text-axis-gray text-sm" style="line-height:1.6;margin-top:0.25rem;">{{ b.tagline }}</p>
      </div>
    }
  </div>

  <div class="brands-cta-wrap">
    <a routerLink="/vehicles" class="btn-gold brands-cta-btn">{{ 'BRANDS.CTA' | translate }}</a>
  </div>
</div>
