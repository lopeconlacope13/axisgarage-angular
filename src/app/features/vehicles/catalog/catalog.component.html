<div class="max-w-7xl mx-auto px-6 pt-32 pb-16">
  <div class="eyebrow mb-3" style="color:#b8952a">INVENTORY</div>
  <h1 class="section-title mb-10">Our <span class="italic">Fleet</span></h1>

  @if (loading) {
    <div class="text-axis-gray text-center py-20">Loading...</div>
  } @else {
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      @for (v of vehicles; track v.id) {
        <div class="vehicle-card">
          <div class="vehicle-img bg-axis-surface flex items-center justify-center" style="height:220px">
            <span class="font-display italic opacity-20" style="color:#b8952a">{{ v.brand }} {{ v.model }}</span>
          </div>
          <div class="p-5">
            <div class="eyebrow mb-1 opacity-60">{{ v.locationName }}</div>
            <h3 class="font-display text-lg font-semibold mb-3">{{ v.brand }} <span class="italic">{{ v.model }}</span></h3>
            <div class="flex items-center justify-between">
              <div>
                <div class="eyebrow" style="font-size:0.6rem">DAILY FROM</div>
                <div class="font-display text-xl font-bold" style="color:#b8952a">€{{ v.pricePerDay }}</div>
              </div>
              <a [routerLink]="['/vehicles', v.id]" class="btn-gold py-2 px-4 text-xs">RESERVE</a>
            </div>
          </div>
        </div>
      }
    </div>
  }
</div>
