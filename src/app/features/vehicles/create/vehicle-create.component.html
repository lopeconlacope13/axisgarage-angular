<!-- ──────────────────────────────────────────────────────────────────────────
     VEHICLE CREATE PAGE
     Página de creación de vehículo. Solo accesible para MANAGER y ADMIN.
     Misma estética glassmorphism que el resto del proyecto.
────────────────────────────────────────────────────────────────────────── -->
<div style="min-height:100vh;background:var(--axis-bg,#0a0a0a);padding:7rem 1.5rem 4rem;">
  <div style="max-width:900px;margin:0 auto;">

    <!-- ── Cabecera de página ────────────────────────────────────────────── -->
    <div style="margin-bottom:2.5rem;">
      <div class="eyebrow" style="font-size:0.6rem;letter-spacing:0.18em;color:var(--axis-gold,#b8952a);margin-bottom:0.5rem;">
        {{ 'VEHICLE_CREATE.EYEBROW' | translate }}
      </div>
      <h1 class="font-display" style="font-size:2rem;font-weight:600;color:#f5f5f0;">
        {{ 'VEHICLE_CREATE.TITLE' | translate }} <span style="font-style:italic;">{{ 'VEHICLE_CREATE.TITLE_ITALIC' | translate }}</span>
      </h1>
      <p style="margin-top:0.5rem;font-size:0.85rem;color:rgba(245,245,240,0.45);">
        {{ 'VEHICLE_CREATE.SUBTITLE' | translate }}
      </p>
    </div>

    <!-- ── Formulario ────────────────────────────────────────────────────── -->
    <div class="glass-card" style="padding:2rem 2.5rem;">

      <!-- Grid de campos: 2 columnas en desktop, 1 en mobile -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem 1.5rem;">

        <!-- Marca -->
        <div>
          <label for="vc-brand" class="eyebrow eyebrow-xs" style="display:block;margin-bottom:0.4rem;color:rgba(245,245,240,0.6);">
            {{ 'VEHICLE_CREATE.LABEL_BRAND' | translate }} *
          </label>
          <input id="vc-brand" type="text" [(ngModel)]="vehicle.brand" placeholder="Ferrari"
            style="width:100%;background:#111;color:#f5f5f0;border:1px solid rgba(245,245,240,0.1);border-radius:4px;padding:0.5rem 0.75rem;font-size:0.875rem;"
            aria-required="true">
        </div>

        <!-- Modelo -->
        <div>
          <label for="vc-model" class="eyebrow eyebrow-xs" style="display:block;margin-bottom:0.4rem;color:rgba(245,245,240,0.6);">
            {{ 'VEHICLE_CREATE.LABEL_MODEL' | translate }} *
          </label>
          <input id="vc-model" type="text" [(ngModel)]="vehicle.model" placeholder="F40"
            style="width:100%;background:#111;color:#f5f5f0;border:1px solid rgba(245,245,240,0.1);border-radius:4px;padding:0.5rem 0.75rem;font-size:0.875rem;"
            aria-required="true">
        </div>

        <!-- Año de producción -->
        <div>
          <label for="vc-year" class="eyebrow eyebrow-xs" style="display:block;margin-bottom:0.4rem;color:rgba(245,245,240,0.6);">
            {{ 'VEHICLE_CREATE.LABEL_YEAR' | translate }}
          </label>
          <input id="vc-year" type="number" [(ngModel)]="vehicle.productionYear" min="1900" max="2100"
            style="width:100%;background:#111;color:#f5f5f0;border:1px solid rgba(245,245,240,0.1);border-radius:4px;padding:0.5rem 0.75rem;font-size:0.875rem;">
        </div>

        <!-- Precio por día -->
        <div>
          <label for="vc-price" class="eyebrow eyebrow-xs" style="display:block;margin-bottom:0.4rem;color:rgba(245,245,240,0.6);">
            {{ 'VEHICLE_CREATE.LABEL_PRICE' | translate }} *
          </label>
          <input id="vc-price" type="number" [(ngModel)]="vehicle.pricePerDay" min="1" step="0.01"
            style="width:100%;background:#111;color:#f5f5f0;border:1px solid rgba(245,245,240,0.1);border-radius:4px;padding:0.5rem 0.75rem;font-size:0.875rem;"
            aria-required="true">
        </div>

        <!-- Categoría -->
        <div>
          <label for="vc-category" class="eyebrow eyebrow-xs" style="display:block;margin-bottom:0.4rem;color:rgba(245,245,240,0.6);">
            {{ 'VEHICLE_CREATE.LABEL_CATEGORY' | translate }} *
          </label>
          <select id="vc-category" [(ngModel)]="vehicle.categoryId"
            style="width:100%;background:#111;color:#f5f5f0;border:1px solid rgba(245,245,240,0.1);border-radius:4px;padding:0.5rem 0.75rem;font-size:0.875rem;appearance:none;"
            aria-required="true">
            <option [value]="0" disabled>{{ 'VEHICLE_CREATE.SELECT_CATEGORY' | translate }}</option>
            @for (cat of categories; track cat.id) {
              <option [value]="cat.id">{{ cat.name }}</option>
            }
          </select>
        </div>

        <!-- Ubicación -->
        <div>
          <label for="vc-location" class="eyebrow eyebrow-xs" style="display:block;margin-bottom:0.4rem;color:rgba(245,245,240,0.6);">
            {{ 'VEHICLE_CREATE.LABEL_LOCATION' | translate }} *
          </label>
          <select id="vc-location" [(ngModel)]="vehicle.locationId"
            style="width:100%;background:#111;color:#f5f5f0;border:1px solid rgba(245,245,240,0.1);border-radius:4px;padding:0.5rem 0.75rem;font-size:0.875rem;appearance:none;"
            aria-required="true">
            <option [value]="0" disabled>{{ 'VEHICLE_CREATE.SELECT_LOCATION' | translate }}</option>
            @for (loc of locations; track loc.id) {
              <option [value]="loc.id">{{ loc.name }} — {{ loc.city }}</option>
            }
          </select>
        </div>

        <!-- Propietario -->
        <div>
          <label for="vc-owner" class="eyebrow eyebrow-xs" style="display:block;margin-bottom:0.4rem;color:rgba(245,245,240,0.6);">
            {{ 'VEHICLE_CREATE.LABEL_OWNER' | translate }} *
          </label>
          <select id="vc-owner" [(ngModel)]="vehicle.ownerId"
            style="width:100%;background:#111;color:#f5f5f0;border:1px solid rgba(245,245,240,0.1);border-radius:4px;padding:0.5rem 0.75rem;font-size:0.875rem;appearance:none;"
            aria-required="true">
            <option [value]="0" disabled>{{ 'VEHICLE_CREATE.SELECT_OWNER' | translate }}</option>
            @for (owner of owners; track owner.id) {
              <option [value]="owner.id">{{ owner.name }} {{ owner.lastName }}</option>
            }
          </select>
        </div>

        <!-- Tipo de motor -->
        <div>
          <label for="vc-engine" class="eyebrow eyebrow-xs" style="display:block;margin-bottom:0.4rem;color:rgba(245,245,240,0.6);">
            {{ 'VEHICLE_CREATE.LABEL_ENGINE' | translate }}
          </label>
          <input id="vc-engine" type="text" [(ngModel)]="vehicle.engineType" placeholder="V12 DOHC"
            style="width:100%;background:#111;color:#f5f5f0;border:1px solid rgba(245,245,240,0.1);border-radius:4px;padding:0.5rem 0.75rem;font-size:0.875rem;">
        </div>

        <!-- Potencia -->
        <div>
          <label for="vc-hp" class="eyebrow eyebrow-xs" style="display:block;margin-bottom:0.4rem;color:rgba(245,245,240,0.6);">
            {{ 'VEHICLE_CREATE.LABEL_HP' | translate }}
          </label>
          <input id="vc-hp" type="number" [(ngModel)]="vehicle.horsePower" min="0"
            style="width:100%;background:#111;color:#f5f5f0;border:1px solid rgba(245,245,240,0.1);border-radius:4px;padding:0.5rem 0.75rem;font-size:0.875rem;">
        </div>

        <!-- Torque -->
        <div>
          <label for="vc-torque" class="eyebrow eyebrow-xs" style="display:block;margin-bottom:0.4rem;color:rgba(245,245,240,0.6);">
            {{ 'VEHICLE_CREATE.LABEL_TORQUE' | translate }}
          </label>
          <input id="vc-torque" type="number" [(ngModel)]="vehicle.torqueNm" min="0"
            style="width:100%;background:#111;color:#f5f5f0;border:1px solid rgba(245,245,240,0.1);border-radius:4px;padding:0.5rem 0.75rem;font-size:0.875rem;">
        </div>

        <!-- Transmisión -->
        <div>
          <label for="vc-trans" class="eyebrow eyebrow-xs" style="display:block;margin-bottom:0.4rem;color:rgba(245,245,240,0.6);">
            {{ 'VEHICLE_CREATE.LABEL_TRANSMISSION' | translate }}
          </label>
          <select id="vc-trans" [(ngModel)]="vehicle.transmission"
            style="width:100%;background:#111;color:#f5f5f0;border:1px solid rgba(245,245,240,0.1);border-radius:4px;padding:0.5rem 0.75rem;font-size:0.875rem;appearance:none;">
            <option value="">{{ 'VEHICLE_CREATE.SELECT_DEFAULT' | translate }}</option>
            <option value="Manual">Manual</option>
            <option value="Automatic">Automatic</option>
            <option value="Semi-automatic">Semi-automatic</option>
            <option value="PDK">PDK</option>
            <option value="DCT">DCT</option>
          </select>
        </div>

        <!-- Tracción -->
        <div>
          <label for="vc-drive" class="eyebrow eyebrow-xs" style="display:block;margin-bottom:0.4rem;color:rgba(245,245,240,0.6);">
            {{ 'VEHICLE_CREATE.LABEL_DRIVETRAIN' | translate }}
          </label>
          <select id="vc-drive" [(ngModel)]="vehicle.drivetrain"
            style="width:100%;background:#111;color:#f5f5f0;border:1px solid rgba(245,245,240,0.1);border-radius:4px;padding:0.5rem 0.75rem;font-size:0.875rem;appearance:none;">
            <option value="">{{ 'VEHICLE_CREATE.SELECT_DEFAULT' | translate }}</option>
            <option value="RWD">RWD</option>
            <option value="AWD">AWD</option>
            <option value="FWD">FWD</option>
            <option value="4WD">4WD</option>
          </select>
        </div>

        <!-- Combustible -->
        <div>
          <label for="vc-fuel" class="eyebrow eyebrow-xs" style="display:block;margin-bottom:0.4rem;color:rgba(245,245,240,0.6);">
            {{ 'VEHICLE_CREATE.LABEL_FUEL' | translate }}
          </label>
          <select id="vc-fuel" [(ngModel)]="vehicle.fuelType"
            style="width:100%;background:#111;color:#f5f5f0;border:1px solid rgba(245,245,240,0.1);border-radius:4px;padding:0.5rem 0.75rem;font-size:0.875rem;appearance:none;">
            <option value="">{{ 'VEHICLE_CREATE.SELECT_DEFAULT' | translate }}</option>
            <option value="Gasoline">Gasoline</option>
            <option value="Diesel">Diesel</option>
            <option value="Hybrid">Hybrid</option>
            <option value="Electric">Electric</option>
          </select>
        </div>

        <!-- 0-100 km/h -->
        <div>
          <label for="vc-zero" class="eyebrow eyebrow-xs" style="display:block;margin-bottom:0.4rem;color:rgba(245,245,240,0.6);">
            {{ 'VEHICLE_CREATE.LABEL_ZERO_HUNDRED' | translate }}
          </label>
          <input id="vc-zero" type="number" [(ngModel)]="vehicle.zeroToHundred" min="0" step="0.1"
            style="width:100%;background:#111;color:#f5f5f0;border:1px solid rgba(245,245,240,0.1);border-radius:4px;padding:0.5rem 0.75rem;font-size:0.875rem;">
        </div>

        <!-- Disponibilidad -->
        <div style="display:flex;align-items:center;gap:0.75rem;padding-top:1.4rem;">
          <input id="vc-available" type="checkbox" [(ngModel)]="vehicle.available"
            style="width:1rem;height:1rem;accent-color:var(--axis-gold,#b8952a);cursor:pointer;">
          <label for="vc-available" class="eyebrow eyebrow-xs" style="color:rgba(245,245,240,0.6);cursor:pointer;">
            {{ 'VEHICLE_CREATE.LABEL_AVAILABLE' | translate }}
          </label>
        </div>

      </div>

      <!-- Descripción (campo ancho, fuera del grid) -->
      <div style="margin-top:1.25rem;">
        <label for="vc-desc" class="eyebrow eyebrow-xs" style="display:block;margin-bottom:0.4rem;color:rgba(245,245,240,0.6);">
          {{ 'VEHICLE_CREATE.LABEL_DESCRIPTION' | translate }}
        </label>
        <textarea id="vc-desc" [(ngModel)]="vehicle.description" rows="3"
          [placeholder]="'VEHICLE_CREATE.DESC_PLACEHOLDER' | translate"
          style="width:100%;background:#111;color:#f5f5f0;border:1px solid rgba(245,245,240,0.1);border-radius:4px;padding:0.5rem 0.75rem;font-size:0.875rem;resize:vertical;font-family:inherit;">
        </textarea>
      </div>

      <!-- Imagen principal (opcional) -->
      <div style="margin-top:1rem;">
        <label for="vc-image" class="eyebrow eyebrow-xs" style="display:block;margin-bottom:0.4rem;color:rgba(245,245,240,0.6);">
          {{ 'VEHICLE_CREATE.LABEL_IMAGE' | translate }}
        </label>
        <input id="vc-image" type="file" accept="image/*"
          (change)="onImageSelected($event)"
          style="font-size:0.8rem;color:rgba(245,245,240,0.6);cursor:pointer;">
      </div>

      <!-- ── Mensajes de error / éxito ──────────────────────────────────── -->
      @if (errorMsg) {
        <div role="alert"
          style="margin-top:1.25rem;padding:0.75rem 1rem;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:4px;color:rgba(239,68,68,0.9);font-size:0.8rem;">
          {{ errorMsg }}
        </div>
      }
      @if (success) {
        <div role="status"
          style="margin-top:1.25rem;padding:0.75rem 1rem;background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.3);border-radius:4px;color:rgba(74,222,128,0.9);font-size:0.8rem;">
          {{ 'VEHICLE_CREATE.SUCCESS_MSG' | translate }}
        </div>
      }

      <!-- ── Botones de acción ───────────────────────────────────────────── -->
      <div style="margin-top:1.75rem;display:flex;justify-content:flex-end;gap:0.75rem;">

        <!-- Cancelar -->
        <button
          (click)="cancel()"
          class="eyebrow"
          style="font-size:0.65rem;letter-spacing:0.12em;padding:0.6rem 1.25rem;border:1px solid rgba(245,245,240,0.2);background:transparent;color:rgba(245,245,240,0.5);border-radius:4px;cursor:pointer;"
          aria-label="Cancelar y volver al dashboard">
          {{ 'VEHICLE_CREATE.BTN_CANCEL' | translate }}
        </button>

        <!-- Crear -->
        <button
          (click)="submit()"
          [disabled]="submitting"
          class="eyebrow"
          style="font-size:0.65rem;letter-spacing:0.12em;padding:0.6rem 1.5rem;border:1px solid var(--axis-gold,#b8952a);background:rgba(184,149,42,0.12);color:var(--axis-gold,#b8952a);border-radius:4px;cursor:pointer;transition:background 0.2s;"
          [style.opacity]="submitting ? '0.6' : '1'"
          [style.cursor]="submitting ? 'not-allowed' : 'pointer'"
          aria-label="Crear vehículo y añadirlo a la flota">
          {{ submitting ? ('VEHICLE_CREATE.BTN_SUBMITTING' | translate) : ('VEHICLE_CREATE.BTN_SUBMIT' | translate) }}
        </button>

      </div>

    </div>
  </div>
</div>
